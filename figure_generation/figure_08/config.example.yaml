    combined: /global/cfs/cdirs/m5243/analysis/unaligned_rRNA_bams/merged_rRNA_samples.tsv
    # This GTF differs from the default; override it here.
    gtf: /home/stefan/Synology/Data_jamboree/final_bedRmods/ont/unaligned_rRNA_bams/combined_v49_rRNAs.gtf
    output_dir: biotype_results/rRNA
    table_name: gene_type_composition_rRNA.tsv
    # Collapse rRNA subunit labels into a single "rRNA" biotype.
    relabel:
      rRNA_5S: rRNA
      rRNA_5.8S: rRNA
      rRNA_18S: rRNA
      rRNA_28S: rRNA
    plots:
      - sample_cols: [combined]
        y_label: rRNA
        hide_yticks: true
        figsize: [16, 4]
        threshold: 0.01
        outfile: Figure1_rRNA_biotype_CPMS_single_dataset.pdf
      - sample_cols: null
        y_label: Sample
        figsize: [16, 8]
        threshold: 0.01
        reverse: true
        outfile: Figure1_rRNA_biotype_CPMS.pdf

