# =====================================================================
# config.example.yaml
# ---------------------------------------------------------------------
# Batch configuration for biotype_analysis.py. Run with:
#
#     python biotype_analysis.py --config config.example.yaml
#
# This reproduces the three analyses from the original script
# (polyA RNA, rRNA, tRNA). Adjust the paths, sample names and options
# for your own data. Anything under `defaults` is inherited by every
# analysis and can be overridden per analysis.
# =====================================================================

defaults:
  # GTF is parsed once and cached across analyses that share the same path.
  gtf: /global/cfs/cdirs/m5243/references/gencode.v49.basic.annotation.gtf
  output_dir: biotype_results
  # Column used to sort the composition table (falls back to total signal
  # if the column is absent).
  sort_by: combined
  # Built-in palette name ("gene_type" / "transcript"), an inline mapping,
  # or a path to a YAML/JSON colour file.
  palette: gene_type
  # Set to false to always use the built-in GTF parser (no dmode needed).
  prefer_dmode: true

analyses:

  # -------------------------------------------------------------------
  # 1. polyA RNA
  # -------------------------------------------------------------------
  - name: polyA
    # base dir for this dataset (kept here only for readability; paths below
    # are the full paths actually used).
    counts:
      HRP_A_001_1: /global/cfs/cdirs/m5243/final_bedRmods/ont/read_count_tables/HRP_A_001_native_polyA_RNA_001.merged.aligned.sorted.tsv
      HRP_A_002_1: /global/cfs/cdirs/m5243/final_bedRmods/ont/read_count_tables/HRP_A_002_native_polyA_RNA_001.merged.aligned.sorted.tsv
      HRP_A_003_1: /global/cfs/cdirs/m5243/final_bedRmods/ont/read_count_tables/HRP_A_003_native_polyA_RNA_001.merged.aligned.sorted.tsv
      HRP_A_005_1: /global/cfs/cdirs/m5243/final_bedRmods/ont/read_count_tables/HRP_A_005_native_polyA_RNA_001.merged.aligned.sorted.tsv
      HRP_A_006_4: /global/cfs/cdirs/m5243/final_bedRmods/ont/read_count_tables/HRP_A_006_native_polyA_RNA_004.merged.aligned.sorted.tsv
      HRP_A_007_1: /global/cfs/cdirs/m5243/final_bedRmods/ont/read_count_tables/HRP_A_007_native_polyA_RNA_001.merged.aligned.sorted.tsv
      HRP_A_009_1: /global/cfs/cdirs/m5243/final_bedRmods/ont/read_count_tables/HRP_A_009_native_polyA_RNA_001.merged.aligned.sorted.tsv
      HRP_A_009_2: /global/cfs/cdirs/m5243/final_bedRmods/ont/read_count_tables/HRP_A_009_native_polyA_RNA_002.merged.aligned.sorted.tsv
      HRP_A_010_1: /global/cfs/cdirs/m5243/final_bedRmods/ont/read_count_tables/HRP_A_010_native_polyA_RNA_001.merged.aligned.sorted.tsv
      HRP_A_010_2: /global/cfs/cdirs/m5243/final_bedRmods/ont/read_count_tables/HRP_A_010_native_polyA_RNA_002.merged.aligned.sorted.tsv
      HRP_A_011_1: /global/cfs/cdirs/m5243/final_bedRmods/ont/read_count_tables/HRP_A_011_native_polyA_RNA_001.merged.aligned.sorted.tsv
      HRP_A_011_2: /global/cfs/cdirs/m5243/final_bedRmods/ont/read_count_tables/HRP_A_011_native_polyA_RNA_002.merged.aligned.sorted.tsv
      HRP_A_011_3: /global/cfs/cdirs/m5243/final_bedRmods/ont/read_count_tables/HRP_A_011_native_polyA_RNA_003.merged.aligned.sorted.tsv
      HRP_A_013_1: /global/cfs/cdirs/m5243/final_bedRmods/ont/read_count_tables/HRP_A_013_native_polyA_RNA_001.merged.aligned.sorted.tsv
      HRP_A_014_1: /global/cfs/cdirs/m5243/final_bedRmods/ont/read_count_tables/HRP_A_014_native_polyA_RNA_001.merged.aligned.sorted.tsv
    combined: /global/cfs/cdirs/m5243/final_bedRmods/ont/read_count_tables/polyA_native_merged.merged.tsv
    table_name: gene_type_composition_polyA.tsv
    # Two figures, matching the original: combined-only, then all samples.
    plots:
      - sample_cols: [combined]
        y_label: polyA RNA
        hide_yticks: true
        figsize: [16, 4]
        threshold: 0.01
        outfile: Figure1_gene_type_composition_combined_only_CPMS.pdf
      - sample_cols: null        # null = all non-combined samples
        y_label: Sample
        figsize: [16, 8]
        threshold: 0.01
        reverse: true            # original reversed the sample order
        outfile: Figure1_gene_type_composition.pdf

  # -------------------------------------------------------------------
  # 2. rRNA
  # -------------------------------------------------------------------
