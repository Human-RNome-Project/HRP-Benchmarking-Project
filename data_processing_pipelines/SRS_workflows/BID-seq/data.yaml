# BID-seq configuration for the HRP pseudouridine RNome samples.
# Paths below are the ones used on the UChicago midway3 cluster; adjust for your system.

reference:
  genes:
    fa: /project/taopan/chenyou/temp/rRNA.fa
  genome:
    fa: /project/taopan/chenyou/genome/Homo_sapiens/GRCh38.fa
    star: /project/taopan/chenyou/genome/Homo_sapiens/star/GRCh38.release110

samples:
  pU_input:
    data:
      - R1: /project/taopan/chenyou/temp/ch_data/bid-seq/HRP_B_031_1_R1.fastq.gz
        R2: /project/taopan/chenyou/temp/ch_data/bid-seq/HRP_B_031_1_R2.fastq.gz
    group: HRP_pU
    treated: false
  pU_treat_rep1:
    data:
      - R1: /project/taopan/chenyou/temp/ch_data/bid-seq/HRP_B_031_2_R1.fastq.gz
        R2: /project/taopan/chenyou/temp/ch_data/bid-seq/HRP_B_031_2_R2.fastq.gz
    group: HRP_pU
    treated: true
  pU_treat_rep2:
    data:
      - R1: /project/taopan/chenyou/temp/ch_data/bid-seq/HRP_B_031_3_R1.fastq.gz
        R2: /project/taopan/chenyou/temp/ch_data/bid-seq/HRP_B_031_3_R2.fastq.gz
    group: HRP_pU
    treated: true

forward_stranded: false
